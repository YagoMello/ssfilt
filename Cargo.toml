[package]
name = "ssfilt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Continuous-time state-space filters for irregularly sampled signals"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yagomello/ssfilt"
keywords = ["filter", "signal-processing", "state-space", "no-std"]
categories = ["no-std", "science", "embedded"]

[features]
default = ["std"]
std = ["num-traits/std"]
libm = ["num-traits/libm"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }

[dev-dependencies]
approx = "0.5.1"
criterion = { version = "0.7.0", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rstest = { version = "0.27.0", default-features = false }

[[bench]]
name = "streaming"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
